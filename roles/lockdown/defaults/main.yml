---

# Feature toggles — naming pattern: <rolename>_enable_<feature>
lockdown_enable_execute: false
lockdown_enable_sudoers_user: true
lockdown_enable_sudoers_admin_group: true
lockdown_enable_aide_async: true
lockdown_enable_xwindow_server: false
lockdown_enable_firewall_package: true
lockdown_enable_sugroup: true

# Regular configuration
lockdown_user: "root"
lockdown_group: "admin"
lockdown_user_home: "/root"
lockdown_repos_dir: "{{ common_default_repo_dir }}/github/ansible-lockdown"
lockdown_cis_repo: "https://github.com/ansible-lockdown/DEBIAN13-CIS"
lockdown_cis_version: "main"
lockdown_firewall_package: iptables
