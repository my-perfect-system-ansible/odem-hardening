---
- name: Restart iptables service
  ansible.builtin.systemd:
    name: "{{ firewall_service_name }}"
    state: restarted
    daemon_reload: true
  become: true

- name: Restart docker service
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  become: true
  when: firewall_enable_docker_compat | bool
